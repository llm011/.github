<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="LLM011 Architecture Map">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0D1526"/>
    </linearGradient>

    <pattern id="archGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.38"/>
    </pattern>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.4"/>
    </linearGradient>

    <clipPath id="archClip">
      <rect x="2" y="2" width="1196" height="426" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#archClip)">
    <rect width="1200" height="430" fill="url(#archBg)"/>
    <rect width="1200" height="430" fill="url(#archGrid)"/>

    <!-- Header Strip -->
    <text x="44" y="38" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#38BDF8" letter-spacing="1.5">
      ECOSYSTEM ARCHITECTURE · 全景协作架构
    </text>
    <line x1="44" y1="50" x2="1156" y2="50" stroke="#1E293B" stroke-width="1"/>

    <!-- Vertical Animated Data Flow Connectors -->
    <g stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4">
      <line x1="360" y1="138" x2="360" y2="164"/>
      <line x1="840" y1="138" x2="840" y2="164"/>
      <line x1="300" y1="244" x2="300" y2="270"/>
      <line x1="600" y1="244" x2="600" y2="270"/>
      <line x1="900" y1="244" x2="900" y2="270"/>
      <line x1="420" y1="336" x2="420" y2="354"/>
      <line x1="880" y1="336" x2="880" y2="354"/>
    </g>

    <!-- Pulsing Flow Dots -->
    <circle cx="360" cy="151" r="3" fill="#38BDF8">
      <animate attributeName="cy" values="138;164" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="840" cy="151" r="3" fill="#A78BFA">
      <animate attributeName="cy" values="138;164" dur="1.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="257" r="3" fill="#2DD4BF">
      <animate attributeName="cy" values="244;270" dur="1.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.7s" repeatCount="indefinite"/>
    </circle>

    <!-- LAYER 1: CLIENTS & CONNECTORS -->
    <g transform="translate(44, 68)">
      <rect x="0" y="0" width="144" height="70" rx="10" fill="#0F172A" stroke="#1E293B"/>
      <text x="16" y="30" font-family="'SF Mono', monospace" font-size="11" font-weight="700" fill="#64748B">LAYER 01</text>
      <text x="16" y="50" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13.5" font-weight="600" fill="#E2E8F0">入口与连接器</text>

      <!-- Card: Multi-Client -->
      <rect x="160" y="0" width="465" height="70" rx="10" fill="#0B192E" stroke="#0284C7" stroke-opacity="0.6"/>
      <text x="180" y="27" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13.5" font-weight="700" fill="#E0F2FE">全端入口 · Web / Desktop / Android / 飞书 / 微信 / CLI / ACP</text>
      <text x="180" y="50" font-family="'SF Mono', monospace" font-size="11.5" fill="#7DD3FC">SSE Streaming · 共享后端与记忆库 · 零配置即开即用</text>

      <!-- Card: dsh-ethan-connector -->
      <rect x="641" y="0" width="471" height="70" rx="10" fill="#161436" stroke="#6366F1" stroke-opacity="0.7"/>
      <rect x="657" y="14" width="166" height="22" rx="6" fill="#1E1B4B" stroke="#818CF8" stroke-width="0.8"/>
      <text x="740" y="29" font-family="'SF Mono', monospace" font-size="11.5" font-weight="700" fill="#C7D2FE" text-anchor="middle">dsh-ethan-connector</text>
      <text x="836" y="29" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12.5" font-weight="600" fill="#E2E8F0">DeepSeek Harness 连接器</text>
      <text x="657" y="53" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#A5B4FC">x-session-id 会话粘性注入 + ethan_run (HTTP / ACP 双传输)</text>
    </g>

    <!-- LAYER 2: AGENT CORE & ROUTING -->
    <g transform="translate(44, 164)">
      <rect x="0" y="0" width="144" height="80" rx="10" fill="#0F172A" stroke="#1E293B"/>
      <text x="16" y="34" font-family="'SF Mono', monospace" font-size="11" font-weight="700" fill="#38BDF8">LAYER 02</text>
      <text x="16" y="54" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13.5" font-weight="600" fill="#E2E8F0">核心与路由</text>

      <!-- Card: ethan-agent -->
      <rect x="160" y="0" width="600" height="80" rx="10" fill="#0A1F33" stroke="#38BDF8" stroke-width="1.4"/>
      <rect x="178" y="14" width="114" height="24" rx="6" fill="#0369A1"/>
      <text x="235" y="30" font-family="'SF Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">ethan-agent</text>
      <text x="306" y="30" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" font-weight="700" fill="#F0F9FF">旗舰个人 AI Agent v2</text>
      <text x="178" y="53" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#BAE6FD">7 大内核热切换 (Native / Claude Code / DSH / OpenCode / Antigravity / Codex / Pi)</text>
      <text x="178" y="69" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#7DD3FC">60+ 工具经 MCP 注入外部内核 · 三层证据链 memory.db 持久化记忆</text>

      <!-- Card: router-models -->
      <rect x="776" y="0" width="336" height="80" rx="10" fill="#1B1638" stroke="#8B5CF6" stroke-opacity="0.75"/>
      <rect x="794" y="14" width="122" height="24" rx="6" fill="#4C1D95"/>
      <text x="855" y="30" font-family="'SF Mono', monospace" font-size="11.5" font-weight="700" fill="#EDE9FE" text-anchor="middle">router-models</text>
      <text x="928" y="30" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="700" fill="#F5F3FF">语义路由器</text>
      <text x="794" y="53" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#DDD6FE">BGE-small-zh-v1.5 INT8 ONNX (24MB)</text>
      <text x="794" y="69" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#C4B5FD">19 类技能毫秒级本地意图分发</text>
    </g>

    <!-- LAYER 3: VOICE & DOMAIN SKILLS -->
    <g transform="translate(44, 270)">
      <rect x="0" y="0" width="144" height="66" rx="10" fill="#0F172A" stroke="#1E293B"/>
      <text x="16" y="28" font-family="'SF Mono', monospace" font-size="11" font-weight="700" fill="#2DD4BF">LAYER 03</text>
      <text x="16" y="48" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13.5" font-weight="600" fill="#E2E8F0">语音与技能</text>

      <!-- Card: ethan-tts -->
      <rect x="160" y="0" width="330" height="66" rx="10" fill="#09242A" stroke="#14B8A6" stroke-opacity="0.75"/>
      <text x="178" y="25" font-family="'SF Mono', monospace" font-size="12.5" font-weight="700" fill="#5EEAD4">ethan-tts</text>
      <text x="270" y="25" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12.5" font-weight="600" fill="#CCFBF1">Apple Silicon 本地语音</text>
      <text x="178" y="48" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#99F6E4">MLX Qwen3-TTS / ASR · 音色克隆 · ~1s 流式对话</text>

      <!-- Card: ethan-legal-skill -->
      <rect x="506" y="0" width="316" height="66" rx="10" fill="#22142B" stroke="#EC4899" stroke-opacity="0.65"/>
      <text x="524" y="25" font-family="'SF Mono', monospace" font-size="12.5" font-weight="700" fill="#F9A8D4">ethan-legal-skill</text>
      <text x="668" y="25" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12.5" font-weight="600" fill="#FCE7F3">法律专家模式</text>
      <text x="524" y="48" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#FBCFE8">单一可路由 legal-assistant · 13 条业务 playbook</text>

      <!-- Card: legal-skills -->
      <rect x="838" y="0" width="274" height="66" rx="10" fill="#1C1927" stroke="#A855F7" stroke-opacity="0.55"/>
      <text x="856" y="25" font-family="'SF Mono', monospace" font-size="12.5" font-weight="700" fill="#E9D5FF">legal-skills</text>
      <text x="962" y="25" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#D8B4FE">(Upstream Fork)</text>
      <text x="856" y="48" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#C4B5FD">49 个法律人 AI Agent 技能集</text>
    </g>

    <!-- LAYER 4: MODEL GATEWAY -->
    <g transform="translate(44, 354)">
      <rect x="0" y="0" width="144" height="58" rx="10" fill="#0F172A" stroke="#1E293B"/>
      <text x="16" y="25" font-family="'SF Mono', monospace" font-size="11" font-weight="700" fill="#F59E0B">LAYER 04</text>
      <text x="16" y="44" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13.5" font-weight="600" fill="#E2E8F0">模型网关</text>

      <!-- Card: buddy-proxy -->
      <rect x="160" y="0" width="600" height="58" rx="10" fill="#1F1912" stroke="#F59E0B" stroke-opacity="0.8"/>
      <text x="178" y="24" font-family="'SF Mono', monospace" font-size="12.5" font-weight="700" fill="#FCD34D">buddy-proxy</text>
      <text x="280" y="24" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12.5" font-weight="600" fill="#FEF3C7">多渠道 AI 模型聚合网关 (OpenAI / Responses / Anthropic)</text>
      <text x="178" y="44" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#FDE68A">Trae · CodeBuddy · Qoder · Gemini · Antigravity · Copilot · 豆包 · MiMo · 方舟 · DeepSeek</text>

      <!-- Card: kiro-gateway -->
      <rect x="776" y="0" width="336" height="58" rx="10" fill="#1A1726" stroke="#F97316" stroke-opacity="0.6"/>
      <text x="794" y="24" font-family="'SF Mono', monospace" font-size="12.5" font-weight="700" fill="#FDBA74">kiro-gateway</text>
      <text x="902" y="24" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#FED7AA">(Upstream Fork)</text>
      <text x="794" y="44" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#FFEDD5">Kiro IDE / CLI 代理网关 · Thinking &amp; Vision</text>
    </g>
  </g>

  <rect x="2" y="2" width="1196" height="426" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1.2"/>
</svg>
